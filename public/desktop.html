<!-- Warm the CDN connections before the render-blocking script fetches -->
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: #1d1d1f; background: #1f1147; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  ::selection { background: rgba(0,122,255,0.4); }

  /* Dock magnification, window open/close scaling and the boot sequence are all
     motion-heavy. Collapse to a single frame when the OS asks for reduced motion
     (kept non-zero so animationend/transitionend handlers still fire). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #0a84ff;
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <noscript>
    <div style="max-width:640px;margin:12vh auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#f5f5f7">
      <h1 style="font-size:32px;margin:0 0 8px">Justin Hatch</h1>
      <p style="margin:0 0 20px">This interactive desktop needs JavaScript.
        <a href="/" style="color:#7ec0ff">The standard portfolio</a> is a better starting point &mdash;
        or go straight to the <a href="/Resume.pdf" style="color:#7ec0ff">resume</a>.</p>
    </div>
  </noscript>

  <!-- Production builds. This page shipped react.development.js and
       react-dom.development.js, which is 256KB over the wire where production
       is 47KB, and the development build also runs slower: it keeps the extra
       invariant checks, the prop-type machinery and the warning paths that
       exist to help while writing code and cost a visitor real milliseconds. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <!-- Modular data: profile must load first (creates window.JH_DATA), rest extend it. -->
  <script src="data/profile.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/experience.js"></script>
  <script src="data/education.js"></script>
  <script src="data/skills.js"></script>
  <script src="data/writing.js"></script>
  <script src="data/now.js"></script>
  <script src="js/desktop.js"></script>
  <!-- Shared with landing.html's floating panel - one bot, one implementation. -->
  <script src="js/chat-app.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/desktop-app.js"></script>
</body>
</html>
