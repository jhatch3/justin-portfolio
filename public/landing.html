<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --ink: #0a2540;
    --ink-2: #2a4365;
    --ink-3: #5a7090;
    --accent: #1d4ed8;
    --accent-soft: #2563eb;
    --border: rgba(10,37,64,0.10);
    --border-strong: rgba(10,37,64,0.20);
    --shadow: 0 1px 2px rgba(10,37,64,0.04), 0 8px 24px rgba(10,37,64,0.06);
  }
  /* js/smooth-scroll.js takes over anchor jumps and switches this to `auto`
     when it is active; this is the fallback for reduced-motion, touch and
     no-JS. scroll-padding-top keeps the sticky nav off the section heading -
     the script reads the same value. */
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }

  /* ── Fluid layout ─────────────────────────────────────────────────────────
     This used to be two breakpoints (768 and 480) doing all the work, which
     meant a 320px phone and a 760px tablet were handed byte-identical padding,
     and the 360-430px band where most phones actually live got one frozen
     layout. Every dimension that should *scale* is now a single clamp() that
     interpolates continuously from a 280px foldable to the 1040px container -
     so there is no width at which the page is caught between two layouts.

     Media queries are kept only for the handful of genuinely binary decisions
     (is there a hamburger? is there room for the secondary CTA?), where there
     is nothing to interpolate.

     Still !important: the components below style themselves inline, and an
     inline declaration outranks any normal rule in a stylesheet. */
  :root {
    --gutter:     clamp(14px, 4vw, 28px);   /* container side padding      */
    --section-y:  clamp(34px, 8.5vw, 96px); /* vertical rhythm per section */
    --hero-photo: clamp(104px, 26vw, 200px);
    --hero-gap:   clamp(20px, 5vw, 48px);
    --cta-icon:   clamp(36px, 10.5vw, 44px);
    /* Corner offset shared by the chat launcher and its cue, so the pair stays
       glued together and both clear the iOS home indicator. */
    --fab-right:  calc(16px + env(safe-area-inset-right, 0px));
    --fab-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .container { padding-left: var(--gutter) !important; padding-right: var(--gutter) !important; }
  section:not(#hero) { padding-top: var(--section-y) !important; padding-bottom: var(--section-y) !important; }
  /* The hero is sized by min-height, not padding: it only needs enough bottom
     room to keep the scroll cue off the fold. */
  #hero { padding-top: clamp(20px, 5vw, 40px) !important; padding-bottom: clamp(28px, 7vw, 40px) !important; }
  /* `.container` is a grandchild of #hero (there is a flex wrapper between
     them), so the `>` here has never matched and the hero row has been stuck
     at its inline gap: 48 on every phone. Descendant combinator. */
  #hero .container > div { gap: var(--hero-gap) !important; }
  /* Last section on the page - it doesn't need a full rhythm unit under it.
     Qualified with `section` on purpose: `:not(#hero)` above carries its
     argument's specificity, so a bare `#contact` (1,0,0) loses to
     `section:not(#hero)` (1,0,1) and this would silently do nothing. */
  section#contact { padding-bottom: clamp(24px, 5vw, 40px) !important; }
  img[alt="Justin Hatch"] { width: var(--hero-photo) !important; height: var(--hero-photo) !important; }
  .hero-ctas a[aria-label] {
    width: var(--cta-icon) !important; height: var(--cta-icon) !important; flex-shrink: 0 !important;
  }

  /* Hamburger is hidden on desktop */
  .nav-hamburger { display: none; }
  @media (max-width: 768px) {
    /* nav: hide section-anchor row, keep name + social icons */
    .nav-sections { display: none !important; }
    /* push social icons right when section anchors are hidden */
    .nav-icons { margin-left: auto !important; }
    .nav-hamburger { display: inline-flex !important; }
    .hero-ctas { gap: 8px !important; }
  }
  /* Below ~360px the name plus four nav targets stop fitting on one 60px row,
     so the social icons step aside - they are repeated in the hero and again
     in Contact, and the hamburger is the affordance that isn't. */
  @media (max-width: 359px) {
    .nav-icons { display: none !important; }
    /* The auto margin that pushes the right-hand group over lives on
       .nav-icons; hiding it takes the margin with it and leaves the
       hamburger stranded beside the name. Hand it to the hamburger. */
    .nav-hamburger { margin-left: auto !important; }
  }

  /* Nothing should be able to push the page wider than the viewport. Note what
     is NOT here: an `overflow-x: clip/hidden` on html or body. Both were tried;
     either one stops the nav from sticking (measured: header top went to
     -1500px at scrollY 1500), because a clipped root is no longer the sticky
     element's scrollport. Horizontal overflow is fixed at the cause instead -
     fluid gutters, a hero column that can shrink, a CTA row that wraps - and
     the responsive audit asserts scrollWidth === innerWidth at every size. */
  img, object, iframe, video, canvas, table, pre { max-width: 100%; }
  /* A long unbroken token (a URL in a bubble, a repo name) must wrap rather
     than widen its container. */
  body { overflow-wrap: break-word; }

  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink-2);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(29,78,216,0.18); color: var(--ink); }
  a { color: var(--accent); text-decoration: none; transition: opacity 0.15s; }
  a:hover { opacity: 0.7; }
  button { font-family: inherit; cursor: pointer; }

  h1 { font-weight: 700 !important; }
  h2 { font-weight: 700 !important; }
  h3 { font-weight: 650 !important; }
  h1, h2, h3 { color: var(--ink); letter-spacing: -0.02em; margin: 0; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Slide-In Button (CSS re-creation of the Framer Slide-In Button design). */
  .slide-in-btn {
    /* Rendered as a <button> - it opens the chat composer rather than
       navigating - so the UA button styles have to be reset here. */
    border: 0;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    overflow: hidden;
    isolation: isolate;
    cursor: pointer;
    transition: color 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    text-decoration: none;
  }
  .slide-in-btn__fill {
    position: absolute;
    inset: 0;
    background: #fff;
    transform: translateX(-101%);
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: -1;
  }
  .slide-in-btn__text, .slide-in-btn__arrow {
    position: relative;
    z-index: 1;
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .slide-in-btn:hover { color: var(--accent); opacity: 1; }
  .slide-in-btn:hover .slide-in-btn__fill  { transform: translateX(0); }
  .slide-in-btn:hover .slide-in-btn__arrow { transform: translateX(3px); }
  .slide-in-btn:focus-visible {
    outline: 2px solid rgba(29,78,216,0.5);
    outline-offset: 2px;
  }

  /* ── Disco ball ───────────────────────────────────────────────────────────
     A hung object, so it swings from its top edge rather than spinning about
     its middle. Hover throws a blurred conic gradient behind it and turns the
     swing up. The glow lives outside the button's edge on purpose: a disco
     ball that lit only the inside of its own circle would be a lamp.
     Colour stays behind the hover, which is what lets this sit in a row of
     navy line icons without fighting them. */
  @keyframes discoSway { 0%, 100% { transform: rotate(-8deg) }
                         50%      { transform: rotate(8deg) } }
  @keyframes discoGlow { to { transform: rotate(360deg) } }

  .disco {
    font-size: 21px; line-height: 1; display: block;
    position: relative; z-index: 1;
    transform-origin: 50% 0;
    animation: discoSway 3.4s ease-in-out infinite;
  }
  .hero-secondary-cta { position: relative; }
  .hero-secondary-cta::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%; z-index: 0;
    background: conic-gradient(from 0deg, #f72585, #ffd166, #4cc9f0, #b5179e, #f72585);
    filter: blur(7px); opacity: 0;
    transition: opacity 0.25s ease;
  }
  .hero-secondary-cta:hover::before,
  .hero-secondary-cta:focus-visible::before {
    opacity: 0.8; animation: discoGlow 2.4s linear infinite;
  }
  .hero-secondary-cta:hover .disco,
  .hero-secondary-cta:focus-visible .disco { animation-duration: 1.1s; }

  /* Every section fades up on entry, the hero headline flips letter-by-letter,
     and the scroll cue bounces. For a visitor with a vestibular disorder that's
     a page full of motion they can't opt out of - honour the OS-level setting.
     Animations are reduced to a single frame rather than removed, so anything
     that relies on an animationend/transitionend callback still fires. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    html { scroll-behavior: auto !important; }
  }

  /* Keyboard users need to see where focus is. The site is heavily custom-styled,
     so several interactive elements otherwise render no visible focus ring. */
  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
</head>
<body>

  <noscript>
    <div style="max-width:640px;margin:12vh auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#0a2540">

  <!-- Wheel/keyboard scrolling with a bit of coast to it. Plain JS, no Babel,
       so it is running before the page finishes hydrating. -->
  <script src="js/smooth-scroll.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <!-- Modular data: profile must load first (creates window.JH_DATA), rest extend it. -->
  <script src="data/profile.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/education.js"></script>

  <!-- The same bot Interactive mode runs; registers window.ChatApp. -->
  <script type="text/babel" src="js/chat-app.jsx"></script>

  <script type="text/babel">
    const D = window.JH_DATA;

    // ─── openChat() ───────────────────────────────────────────────────────────
    // Outreach used to mean a mailto: link - which assumes a configured mail
    // client, and silently does nothing for a recruiter on a work laptop that
    // doesn't have one. Every "reach out" affordance now opens the chat panel's
    // composer instead. An event rather than a prop drill: the launcher lives at
    // the end of <App/>, the buttons are scattered through five sections.
    const openChat = (intent) =>
      window.dispatchEvent(new CustomEvent('jh-open-chat', { detail: { contact: true, intent } }));

    // ─── cn() ─────────────────────────────────────────────────────────────────
    // Tiny shadcn-style class joiner (no tailwind-merge - keep it light).
    const cn = (...args) => args.flat().filter(Boolean).join(' ');

    // ─── useMedia ─────────────────────────────────────────────────────────────
    // Subscribes to a media query and re-renders on change. Layout decisions
    // that CSS can't express - "render a different component", "don't attach
    // this drag handler" - need the match in JS, and they need to survive a
    // rotation or a resized window, not just the width the page happened to
    // load at.
    const useMedia = (query) => {
      const [matches, setMatches] = React.useState(() => window.matchMedia(query).matches);
      React.useEffect(() => {
        const mq = window.matchMedia(query);
        const onChange = (e) => setMatches(e.matches);
        setMatches(mq.matches);
        mq.addEventListener('change', onChange);
        return () => mq.removeEventListener('change', onChange);
      }, [query]);
      return matches;
    };

    // A mouse, and a window big enough to park a floating panel beside the
    // page. Everything else - phone, tablet, a laptop window dragged narrow -
    // gets the touch-shaped treatment.
    const POINTER_FINE = '(hover: hover) and (pointer: fine)';
    // A panel on a phone, or on any window too short to hold one, is a
    // full-screen sheet. 640px is where a 380px panel stops leaving usable
    // page beside it; 520px tall is where a panel plus its launcher stops
    // fitting above the fold at all (measured: landscape phones).
    const SHEET_QUERY = '(max-width: 640px), (max-height: 520px)';

    // ─── useOutsideClick ─────────────────────────────────────────────────────
    const useOutsideClick = (ref, callback) => {
      React.useEffect(() => {
        const listener = (e) => {
          if (!ref.current || ref.current.contains(e.target)) return;
          callback(e);
        };
        document.addEventListener('mousedown', listener);
        document.addEventListener('touchstart', listener);
        return () => {
          document.removeEventListener('mousedown', listener);
          document.removeEventListener('touchstart', listener);
        };
      }, [ref, callback]);
    };

    // ─── Projects list ───────────────────────────────────────────────────────
    // A compact index: one line per project, title plus sector. The subtitle is
    // hidden until you hover the row (or focus it), so the default state is
    // eleven titles rather than eleven paragraphs. Screenshots live only in the
    // detail panel.
    //
    // Hover, focus and the reveal are plain CSS rather than React state: it
    // keeps the row from re-rendering on every pointer move, and it lets the
    // (hover: none) query below pin the subtitles open on touch, where there is
    // no hover to reveal them with.
    const projectRows = D.projects.map(p => ({
      id: p.id,
      title: p.name,
      description: p.subtitle,
      url: p.url || null,
      writeup: p.writeup || null,
      bullets: p.bullets || [],
      tags: p.tags,
      sector: p.sector,
      image: p.image,
    }));

    const ProjectsList = () => {
      const [active, setActive] = React.useState(null);
      const ref = React.useRef(null);

      React.useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setActive(null); };
        document.body.style.overflow = active ? 'hidden' : 'auto';
        window.addEventListener('keydown', onKey);
        return () => {
          document.body.style.overflow = 'auto';
          window.removeEventListener('keydown', onKey);
        };
      }, [active]);

      useOutsideClick(ref, () => setActive(null));

      return (
        <>
          {/* Detail panel */}
          {active && (
            <>
              {/* Backdrop sits above the sticky nav (z:50) so the hamburger is
                  both visually covered AND non-clickable while a project is
                  open. */}
              <div className="fixed inset-0 bg-black/30 z-[60] animate-[fadeIn_0.18s_ease-out]" />
              <div className="fixed inset-0 grid place-items-center z-[100]" style={{
                padding: 'max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))',
              }}>
                <div ref={ref} style={{
                  width: '100%', maxWidth: 560,
                  // vh on a phone means "viewport with the URL bar retracted",
                  // so a 90vh card is taller than the screen the moment the bar
                  // is showing. dvh is the height actually on screen right now.
                  maxHeight: '90vh', maxBlockSize: '90dvh',
                  display: 'flex', flexDirection: 'column',
                  background: 'var(--surface)', borderRadius: 14, overflow: 'hidden',
                  border: '1px solid var(--border)', boxShadow: 'var(--shadow)',
                  animation: 'scaleIn 0.18s ease-out',
                }}>
                  {active.image && (
                    <img src={active.image} alt={active.title} loading="lazy" decoding="async"
                      width="1200" height="800"
                      style={{
                        // A fixed 240px screenshot eats half a phone screen
                        // before the text starts; scale it with the viewport.
                        display: 'block', width: '100%', height: 'clamp(132px, 26vh, 240px)',
                        objectFit: 'cover', objectPosition: 'top',
                        borderBottom: '0.5px solid var(--border)', background: '#f0f3f8',
                      }} />
                  )}
                  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 16, padding: '22px 24px 0' }}>
                    <div style={{ minWidth: 0 }}>
                      <SectorBadge sector={active.sector} />
                      <h3 style={{ fontSize: 19, marginTop: 8 }}>{active.title}</h3>
                      <p style={{ fontSize: 13.5, color: 'var(--ink-3)', margin: '6px 0 0', lineHeight: 1.5 }}>
                        {active.description}
                      </p>
                    </div>
                    {/* Bare icon, not a floating pill over the image. */}
                    <button onClick={() => setActive(null)} aria-label="Close"
                      style={{ background: 'transparent', border: 0, padding: 4, margin: -4, lineHeight: 0, color: 'var(--ink-3)', flexShrink: 0, transition: 'color 0.15s' }}
                      onMouseEnter={(e) => { e.currentTarget.style.color = 'var(--ink)'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.color = 'var(--ink-3)'; }}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
                    </button>
                  </div>
                  <div style={{ padding: '20px 24px 24px', overflowY: 'auto' }}>
                    {active.bullets.length > 0 && (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 9, marginBottom: 20 }}>
                        {active.bullets.map((b, i) => (
                          <div key={i} style={{ display: 'flex', gap: 10, fontSize: 13.5, lineHeight: 1.6, color: 'var(--ink-2)' }}>
                            <span style={{ color: 'var(--border-strong)', flexShrink: 0, userSelect: 'none' }}>-</span>
                            <span>{b}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {/* Text links, no pills. Absent entirely when there's no
                        public repo - the old fallback pointed at #projects. */}
                    {(active.url || active.writeup) && (
                      <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap', marginBottom: 18, fontSize: 14, fontWeight: 600 }}>
                        {active.url && (
                          <a href={active.url} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--accent)' }}>GitHub ↗</a>
                        )}
                        {active.writeup && (
                          <a href={active.writeup} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--accent)' }}>Write-up ↗</a>
                        )}
                      </div>
                    )}
                    <div style={{
                      fontSize: 11, fontFamily: "'JetBrains Mono', monospace",
                      color: 'var(--ink-3)', letterSpacing: '0.04em', lineHeight: 1.7,
                    }}>
                      {active.tags.join(' · ')}
                    </div>
                  </div>
                </div>
              </div>
            </>
          )}

    // ─── FlipWords (CSS-keyframe port of Aceternity's flip-words) ───────────
    // Cycles through words; each word fades+blur-clears letter-by-letter on entry.
    const FlipWords = ({ words, duration = 3000, className }) => {
      const [idx, setIdx] = React.useState(0);
      React.useEffect(() => {
        const t = setTimeout(() => setIdx(i => (i + 1) % words.length), duration);
        return () => clearTimeout(t);
      }, [idx, duration, words.length]);

      const word = words[idx];
      const letters = word.split('');

      return (
        <span className={cn('z-10 inline-block relative text-left px-1', className)} style={{ verticalAlign: 'baseline' }}>
          <span className="inline-block whitespace-nowrap" key={idx}>
            {letters.map((letter, i) => (
              <span key={`${idx}-${i}`} className="inline-block"
                onAnimationEnd={(e) => {
                  e.currentTarget.style.filter = 'none';
                  e.currentTarget.style.willChange = 'auto';
                }}
                style={{
                  animation: `flipLetter 0.45s ease-out ${i * 0.045}s both`,
                  whiteSpace: letter === ' ' ? 'pre' : 'normal',
                  willChange: 'filter, transform, opacity',
                  WebkitFontSmoothing: 'antialiased',
                  MozOsxFontSmoothing: 'grayscale',
                }}>
                {letter === ' ' ? ' ' : letter}
              </span>
            ))}
          </span>
          <style>{`
            @keyframes flipLetter {
              from { opacity: 0; transform: translateY(10px); filter: blur(8px); }
              to   { opacity: 1; transform: translateY(0);   filter: blur(0);   }
            }
            /* Mobile: skip the filter:blur path entirely. iOS and Android both
               leave residual sub-pixel blur on letters that animate through
               filter:blur() because the compositor layer doesn't release cleanly.
               Pure opacity + translate keeps text crisp. */
            @media (max-width: 768px), (hover: none), (pointer: coarse) {
              @keyframes flipLetter {
                from { opacity: 0; transform: translateY(10px); }
                to   { opacity: 1; transform: translateY(0);   }
              }
            }
          `}</style>
        </span>
      );
    };

    // ─── GitHub contribution graph (live) ──────────────────────────────────────
    // Just the 53-week × 7-day square grid of the last year's public
    // contributions, sitting under the hero text. The whole grid links to the
    // GitHub profile. Data comes from the open, CORS-enabled jogruber proxy of
    // GitHub's contributions calendar (no token needed) and is cached in
    // localStorage for 6h so repeat visits paint instantly.
    const CONTRIB_LEVELS = [
      'rgba(10,37,64,0.10)',   // 0 - no contributions
      'rgba(23,62,170,0.45)',  // 1
      'rgba(23,62,170,0.66)',  // 2
      'rgba(23,62,170,0.85)',  // 3
      'rgba(20,52,140,1)',     // 4 - busiest days, deep navy-blue
    ];
    const ContributionGraph = () => {
      const handle = ((D.links.github && D.links.github.label) || 'github.com/jhatch3')
        .replace(/^github\.com\//, '').replace(/\/$/, '');
      const githubHref = (D.links.github && D.links.github.href) || ('https://github.com/' + handle);
      const [data, setData] = React.useState(null);   // { total, days: [{date,count,level}] }
      const [failed, setFailed] = React.useState(false);

      React.useEffect(() => {
        let alive = true;
        const cacheKey = 'gh-contrib:' + handle;
        const TTL = 6 * 60 * 60 * 1000;
        // Paint instantly from cache if it's fresh…
        try {
          const raw = localStorage.getItem(cacheKey);
          if (raw) {
            const c = JSON.parse(raw);
            if (c && Date.now() - c.t < TTL && c.d) setData(c.d);
          }
        } catch (e) { /* private mode / quota - ignore */ }
        // …then always refresh in the background.
        fetch('https://github-contributions-api.jogruber.de/v4/' + encodeURIComponent(handle) + '?y=last')
          .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(json => {
            if (!alive) return;
            const payload = { total: (json.total && json.total.lastYear) || 0, days: json.contributions || [] };
            setData(payload);
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), d: payload })); } catch (e) {}
          })
          .catch(() => { if (alive) setFailed(true); });
        return () => { alive = false; };
      }, [handle]);

      // Bucket the flat day list into week-columns (rows = Sun→Sat), padding the
      // first column so the calendar starts on the right weekday.
      const weeks = React.useMemo(() => {
        if (!data || !data.days.length) return [];
        const out = [];
        let col = [];
        const firstDow = new Date(data.days[0].date + 'T00:00:00').getDay();
        for (let i = 0; i < firstDow; i++) col.push(null);
        data.days.forEach(d => {
          col.push(d);
          if (col.length === 7) { out.push(col); col = []; }
        });
        if (col.length) { while (col.length < 7) col.push(null); out.push(col); }
        return out;
      }, [data]);

      // Fifty-three columns is a year, and a year does not fit on a phone: at
      // 343px of usable width the gaps alone eat 156px and each square lands
      // at 3.5px - a grey smear, not a calendar. So measure the box we were
      // actually given and keep only as many of the most recent weeks as can
      // render at a legible size. A phone gets a crisp six months; a desktop
      // still gets the full year.
      const boxRef = React.useRef(null);
      const [boxW, setBoxW] = React.useState(0);
      React.useEffect(() => {
        const el = boxRef.current;
        if (!el || typeof ResizeObserver === 'undefined') return;
        const ro = new ResizeObserver(([e]) => setBoxW(e.contentRect.width));
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      const MIN_SQ = 7;   // below this the squares stop reading as squares
      const GAP = boxW && boxW < 420 ? 2 : 3;
      const fits = boxW ? Math.max(8, Math.floor((boxW + GAP) / (MIN_SQ + GAP))) : 53;

      const skeleton = !data && !failed;
      const allCols = skeleton ? Array.from({ length: 53 }) : weeks;
      const cols = allCols.slice(Math.max(0, allCols.length - Math.min(fits, 53)));
      const months = Math.round((cols.length / 53) * 12);

      // Fetch failed and nothing cached: render nothing rather than an empty frame.
      if (failed && !data) return null;

      // Just the squares. The whole grid is a subtle link to the GitHub profile.
      return (
        <a href={githubHref} target="_blank" rel="noopener noreferrer"
           ref={boxRef}
           className="contrib-grid"
           aria-label={data
             ? `GitHub contributions, last ${months} months (${data.total.toLocaleString()} in the last year)`
             : 'GitHub contributions'}
           title={`GitHub contributions · last ${months} months`}
           style={{
             display: 'block', marginTop: 'clamp(18px, 4vw, 28px)', width: '100%',
             opacity: skeleton ? 0.5 : 1, transition: 'opacity 0.3s',
             animation: 'fadeUp 0.6s ease-out',
           }}>
          <div style={{ display: 'flex', gap: GAP, width: '100%' }}>
            {cols.map((col, ci) => (
              <div key={ci} style={{ display: 'flex', flexDirection: 'column', gap: GAP, flex: '1 1 0', minWidth: 0 }}>
                {(skeleton ? Array.from({ length: 7 }) : col).map((d, ri) => (
                  <div key={ri}
                    title={(!skeleton && d) ? (d.count + ' contribution' + (d.count === 1 ? '' : 's') + ' on ' + d.date) : undefined}
                    style={{
                      width: '100%', aspectRatio: '1', borderRadius: 2,
                      background: skeleton ? CONTRIB_LEVELS[0] : (d ? CONTRIB_LEVELS[d.level] : 'transparent'),
                      outline: (!skeleton && d) ? '0.5px solid rgba(10,37,64,0.04)' : 'none',
                      outlineOffset: -0.5,
                    }} />
                ))}
              </div>
            ))}
          </div>
        </a>
      );
    };

    // ─── Chat launcher ────────────────────────────────────────────────────────
    // Bottom-right bubble that opens the same bot Interactive mode runs
    // (window.ChatApp, from js/chat-app.jsx).
    //
    // Two shapes, chosen by SHEET_QUERY rather than by a one-time width read,
    // so rotating the phone re-picks:
    //
    //   Desktop - a floating panel pinned to the bottom-right corner. Its top
    //     and left edges are the ones that move, so you drag the left edge for
    //     width, the top edge for height, the corner for both. Size is
    //     remembered across visits.
    //   Phone / short window - a full-screen sheet. There is no room for a card
    //     plus a launcher plus readable page behind it, the drag grips need a
    //     mouse, and the software keyboard needs the whole height anyway.
    const CHAT_MIN = { w: 300, h: 320 };
    const CHAT_DEFAULT = { w: 380, h: 560 };
    const CHAT_SIZE_KEY = 'jh-chat-size';
    const CHAT_SEEN_KEY = 'jh-chat-seen';
    const CHAT_MARGIN = 24;   // breathing room left of the panel
    const CHAT_RESERVE = 100; // room above it for the launcher + page edge

    // The viewport wins, always. The old version applied CHAT_MIN *after* the
    // viewport cap - `Math.min(Math.max(w, MIN), Math.max(MIN, avail))` - which
    // let the minimum beat the space available and pushed the panel off-screen:
    // measured at x = -40 on a 280px-wide phone and y = -22 on a landscape
    // phone, where the panel's own header and close button were cut off.
    const clampChat = ({ w, h }) => {
      const availW = Math.max(200, window.innerWidth - CHAT_MARGIN);
      const availH = Math.max(240, window.innerHeight - CHAT_RESERVE);
      return {
        w: Math.min(Math.max(w, Math.min(CHAT_MIN.w, availW)), availW),
        h: Math.min(Math.max(h, Math.min(CHAT_MIN.h, availH)), availH),
      };
    };

    const ChatLauncher = () => {
      const Bot = window.ChatApp;
      const sheet = useMedia(SHEET_QUERY);
      const finePointer = useMedia(POINTER_FINE);
      const [open, setOpen] = React.useState(false);
      // Mount on first open, then keep it mounted and just hide it, so closing
      // the panel doesn't throw away the conversation.
      const [mounted, setMounted] = React.useState(false);
      // Bumped by every openChat() call; ChatApp opens its composer on change.
      const [contactReq, setContactReq] = React.useState(0);
      const [contactIntent, setContactIntent] = React.useState(undefined);
      // Retired for the rest of this session once the chat has been opened, and
      // sessionStorage rather than localStorage on purpose: a cue that never
      // comes back is invisible to everyone who has clicked it once (including
      // whoever is building the site), while one that reappears mid-session is
      // nagging. New tab or new visit, the nudge is back.
      const [seen, setSeen] = React.useState(() => {
        try { return sessionStorage.getItem(CHAT_SEEN_KEY) === '1'; } catch (_) { return false; }
      });
      const [size, setSize] = React.useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(CHAT_SIZE_KEY) || 'null');
          if (saved && saved.w && saved.h) return clampChat(saved);
        } catch (_) { /* private mode, or someone hand-edited it */ }
        return clampChat(CHAT_DEFAULT);
      });
      const panelRef = React.useRef(null);
      const dragRef = React.useRef(null);

      React.useEffect(() => {
        try { localStorage.setItem(CHAT_SIZE_KEY, JSON.stringify(size)); } catch (_) {}
      }, [size]);

      // A panel sized on a large window must not overflow a small one. Also
      // fires on rotation, which is the case that used to leave the panel
      // hanging off the top of a landscape phone.
      React.useEffect(() => {
        const onResize = () => setSize(s => clampChat(s));
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
        return () => {
          window.removeEventListener('resize', onResize);
          window.removeEventListener('orientationchange', onResize);
        };
      }, []);

      // ── Software keyboard ──────────────────────────────────────────────────
      // A `position: fixed` element is laid out against the *layout* viewport,
      // which iOS does not shrink when the keyboard comes up - so a sheet
      // pinned to inset:0 keeps its full height and the composer ends up
      // underneath the keys. visualViewport reports the part actually on
      // screen; the sheet follows it.
      const [vv, setVv] = React.useState(null);
      React.useEffect(() => {
        const v = window.visualViewport;
        if (!v) return;
        const sync = () => setVv({ h: v.height, top: v.offsetTop });
        sync();
        v.addEventListener('resize', sync);
        v.addEventListener('scroll', sync);
        return () => { v.removeEventListener('resize', sync); v.removeEventListener('scroll', sync); };
      }, []);

      // The page must not scroll under an open sheet - on touch the sheet
      // covers everything, so any movement behind it is just the page getting
      // lost while you type.
      React.useEffect(() => {
        if (!(open && sheet)) return;
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => { document.body.style.overflow = prev; };
      }, [open, sheet]);

      React.useEffect(() => {
        const onOpenChat = (e) => {
          setMounted(true);
          setOpen(true);
          markSeen();
          if (e.detail?.contact) {
            setContactIntent(e.detail.intent);
            setContactReq(n => n + 1);
          }
        };
        window.addEventListener('jh-open-chat', onOpenChat);
        return () => window.removeEventListener('jh-open-chat', onOpenChat);
      }, []);

      React.useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [open]);

      // Reopening keeps the thread, so put the caret back in the composer -
      // but only where a caret is cheap. On a phone, focusing the composer
      // throws the software keyboard up over half the screen before the
      // visitor has decided they want to type, and iOS scrolls the page to
      // chase the focused element on the way.
      React.useEffect(() => {
        if (open && finePointer) panelRef.current?.querySelector('textarea')?.focus();
      }, [open, finePointer]);

      const markSeen = () => {
        setSeen(true);
        try { sessionStorage.setItem(CHAT_SEEN_KEY, '1'); } catch (_) {}
      };

      const toggle = () => { setMounted(true); setOpen(o => !o); markSeen(); };

      const startResize = (axis) => (e) => {
        e.preventDefault();
        e.currentTarget.setPointerCapture?.(e.pointerId);
        dragRef.current = { axis, x: e.clientX, y: e.clientY, ...size };
      };
      const onResizeMove = (e) => {
        const d = dragRef.current;
        if (!d) return;
        setSize(clampChat({
          w: d.axis === 'y' ? d.w : d.w + (d.x - e.clientX),
          h: d.axis === 'x' ? d.h : d.h + (d.y - e.clientY),
        }));
      };
      const endResize = (e) => {
        dragRef.current = null;
        e.currentTarget.releasePointerCapture?.(e.pointerId);
      };

      // Drag grips are mouse-only furniture, and on a phone they were actively
      // harmful: three `touch-action: none` strips down the left and top edges
      // of a panel that spans almost the whole screen, swallowing taps and
      // turning an attempted scroll into a resize.
      const grip = (axis, style, cursor, label) => finePointer && !sheet ? (
        <div
          onPointerDown={startResize(axis)}
          onPointerMove={onResizeMove}
          onPointerUp={endResize}
          onPointerCancel={endResize}
          aria-label={label}
          style={{ position: 'absolute', touchAction: 'none', cursor, zIndex: 2, ...style }}
        />
      ) : null;

      // Keyboard equivalent of dragging a corner: full size, or back again.
      const big = clampChat({ w: 860, h: 10000 });
      const maximized = size.w >= big.w - 1 && size.h >= big.h - 1;
      const toggleSize = () => setSize(maximized ? clampChat(CHAT_DEFAULT) : big);

      const chromeBtn = {
        width: 26, height: 26, borderRadius: 7, cursor: 'pointer',
        background: 'var(--bg)', color: 'var(--ink-2)',
        border: '1px solid var(--border)',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', padding: 0,
      };

      // A first-visit nudge, in the same register as the hero's scroll cue: mono
      // caps, gentle motion, gone once it has been acted on. "CHAT HERE" is set
      // on the upper-left quarter of a circle centred on the button - the only
      // quadrant with room, since the button is pinned to the corner - and a
      // dash sweeps that same quarter. Radius 48 keeps the type clear of the
      // 28px button; anything tighter tucks it under the blue. Decorative, so
      // aria-hidden (the button has its own label) and pointer-events: none.
      // Desktop only. On a phone the launcher already sits under your thumb,
      // and a decoration wrapped around it is one more thing in the way.
      const cue = finePointer && !sheet && !open && !seen && (
        <div aria-hidden="true" style={{
          // Centred on the launcher, which itself sits inside the safe area -
          // so the pair stays glued together on a notched phone instead of the
          // type drifting off the button.
          position: 'fixed', zIndex: 62,
          // 160/2 - 56/2 = 52: line the cue's centre up with the button's.
          right: 'calc(var(--fab-right) - 52px)', bottom: 'calc(var(--fab-bottom) - 52px)',
          width: 160, height: 160, pointerEvents: 'none',
          animation: 'chatCueIn 0.5s ease-out 1.4s both',
        }}>
          <svg viewBox="0 0 160 160" width="160" height="160" fill="none">
            <defs>
              {/* Two concentric quarters: the line hugs the button at r=46, the
                  type rides r=58. One shared path put the hairline straight
                  through the letterforms. */}
              <path id="chat-cue-arc" d="M 34 80 A 46 46 0 0 1 80 34" />
              <path id="chat-cue-type" d="M 22 80 A 58 58 0 0 1 80 22" />
            </defs>
            {/* the quarter moon itself */}
            <use href="#chat-cue-arc" stroke="var(--border-strong)" strokeWidth="1" />
            {/* and a dash travelling along it */}
            <use href="#chat-cue-arc" stroke="var(--accent)" strokeWidth="2.5"
                 strokeLinecap="round" strokeDasharray="15 73"
                 style={{ animation: 'chatCueSweep 2.6s ease-in-out infinite' }} />
            <text style={{ animation: 'chatCueSwing 2.8s ease-in-out infinite', transformOrigin: '80px 80px' }}
                  fill="var(--ink)" fontSize="10" fontWeight="600" letterSpacing="0.8"
                  fontFamily="'JetBrains Mono', monospace">
              <textPath href="#chat-cue-type" startOffset="50%" textAnchor="middle">CHAT HERE</textPath>
            </text>
          </svg>
        </div>
      );

      return (
        <>
          <style>{`
            @keyframes chatCueIn    { from { opacity: 0 } to { opacity: 1 } }
            @keyframes chatCueSweep { from { stroke-dashoffset: 15 } to { stroke-dashoffset: -73 } }
            @keyframes chatCueSwing { 0%, 100% { transform: rotate(-3.5deg) } 50% { transform: rotate(3.5deg) } }
            /* Lift on hover - but only where hovering is a thing. On touch,
               :hover latches after a tap and the button stays shoved up 2px
               until you tap something else. */
            .chat-fab { transition: transform 0.15s, box-shadow 0.15s; }
            @media (hover: hover) and (pointer: fine) {
              .chat-fab:hover { transform: translateY(-2px); }
            }
          `}</style>
          {cue}
          {mounted && (
            <div
              ref={panelRef}
              role="dialog"
              aria-modal={sheet ? 'true' : undefined}
              aria-label="Chat with Justin's bot"
              style={{
                position: 'fixed', zIndex: 60,
                display: open ? 'block' : 'none',
                background: 'var(--surface)',
                ...(sheet ? {
                  // Full-screen sheet. Height follows the visual viewport so
                  // the composer stays above the software keyboard; `top`
                  // follows its offset so it stays put while iOS scrolls the
                  // visual viewport around underneath.
                  left: 0, right: 0,
                  top: vv ? vv.top : 0,
                  height: vv ? vv.h : '100vh',
                  blockSize: vv ? vv.h : '100dvh',
                  // All four insets, not just top/bottom: SHEET_QUERY's
                  // (max-height: 520px) arm is landscape phones, where the
                  // notch and the rounded corners are on the *sides* and the
                  // transcript would run underneath them.
                  paddingTop: 'env(safe-area-inset-top, 0px)',
                  paddingBottom: 'env(safe-area-inset-bottom, 0px)',
                  paddingLeft: 'env(safe-area-inset-left, 0px)',
                  paddingRight: 'env(safe-area-inset-right, 0px)',
                  borderRadius: 0, border: 0, overflow: 'hidden',
                } : {
                  // Same corner offsets as the launcher below, so the panel and
                  // the button it hangs off stay flush. 72px clears the 56px
                  // button plus a 16px gap.
                  right: 'var(--fab-right)', bottom: 'calc(var(--fab-bottom) + 72px)',
                  width: size.w, height: size.h,
                  borderRadius: 16, overflow: 'hidden',
                  border: '1px solid var(--border-strong)',
                  boxShadow: '0 2px 6px rgba(10,37,64,0.06), 0 18px 48px rgba(10,37,64,0.18)',
                }),
              }}
            >
              {grip('both', { left: 0, top: 0, width: 16, height: 16 }, 'nwse-resize', 'Resize chat width and height')}
              {grip('x', { left: 0, top: 16, bottom: 0, width: 7 }, 'ew-resize', 'Resize chat width')}
              {grip('y', { top: 0, left: 16, right: 0, height: 7 }, 'ns-resize', 'Resize chat height')}

              {/* Window chrome, floating over the bot's own header. On a sheet
                  there is no size to toggle (it is already the screen) and the
                  close button is the only way out, so it gets a 40px target
                  instead of a 26px one. */}
              <div style={{
                position: 'absolute', zIndex: 3, display: 'flex', gap: 6,
                top: `calc(${sheet ? 14 : 12}px + env(safe-area-inset-top, 0px))`,
                right: sheet ? 'calc(12px + env(safe-area-inset-right, 0px))' : 12,
              }}>
                {!sheet && (
                  <button onClick={toggleSize} style={chromeBtn}
                    title={maximized ? 'Shrink chat' : 'Expand chat'}
                    aria-label={maximized ? 'Shrink chat' : 'Expand chat'}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                      {maximized
                        ? <><polyline points="9 4 9 9 4 9" /><polyline points="15 20 15 15 20 15" /></>
                        : <><polyline points="15 4 20 4 20 9" /><polyline points="9 20 4 20 4 15" /></>}
                    </svg>
                  </button>
                )}
                <button onClick={() => setOpen(false)} title="Close chat" aria-label="Close chat"
                  style={sheet ? { ...chromeBtn, width: 44, height: 44, borderRadius: 13 } : chromeBtn}>
                  <svg width={sheet ? 18 : 13} height={sheet ? 18 : 13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18" />
                  </svg>
                </button>
              </div>

              <div style={{ width: '100%', height: '100%' }}>
                {/* theme="light" so the panel reads as part of this page, not the desktop. */}
                {Bot ? <Bot theme="light" contactRequest={contactReq} contactIntent={contactIntent} /> : (
                  <div style={{ padding: 20, color: 'var(--ink-2)', fontSize: 13, lineHeight: 1.5 }}>
                    The bot didn't load. Try <a href="desktop.html">Interactive mode</a>.
                  </div>
                )}
              </div>
            </div>
          )}

          {/* While the sheet is open it covers the whole screen, so a launcher
              floating on top of it is just a second close button sitting over
              the composer - and a second element labelled "Close chat". Drop it
              from the tree entirely rather than hiding it; the sheet's own close
              button is the way out. */}
          {!(sheet && open) && (
          <button
            className="chat-fab"
            onClick={toggle}
            aria-expanded={open}
            title={open ? 'Close chat' : "Chat with Justin's bot"}
            aria-label={open ? 'Close chat' : "Chat with Justin's bot"}
            style={{
              position: 'fixed', zIndex: 61,
              right: 'var(--fab-right)', bottom: 'var(--fab-bottom)',
              display: 'flex',
              width: 56, height: 56, borderRadius: '50%', border: 0, cursor: 'pointer',
              background: 'var(--accent)', color: '#fff',   // same blue as Hire me
              alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 10px 26px rgba(29,78,216,0.32)',
            }}
          >
            {open ? (
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            ) : (
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                <circle cx="8.8" cy="11.6" r="1.05" fill="currentColor" stroke="none" />
                <circle cx="12.4" cy="11.6" r="1.05" fill="currentColor" stroke="none" />
                <circle cx="16" cy="11.6" r="1.05" fill="currentColor" stroke="none" />
              </svg>
            )}
          </button>
          )}
        </>
      );
    };

    // ─── App ──────────────────────────────────────────────────────────────────
    const App = () => (
      <>
        <Nav />
        <Hero />
        <ResumeEmbed />
        <ProjectsCardSection />
        <Writing />
        <EducationSection />
        <Contact />
        <ChatLauncher />
      </>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
