<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --ink: #0a2540;
    --ink-2: #2a4365;
    --ink-3: #5a7090;
    --accent: #1d4ed8;
    --accent-soft: #2563eb;
    --border: rgba(10,37,64,0.10);
    --border-strong: rgba(10,37,64,0.20);
    --shadow: 0 1px 2px rgba(10,37,64,0.04), 0 8px 24px rgba(10,37,64,0.06);
  }
  /* js/smooth-scroll.js takes over anchor jumps and switches this to `auto`
     when it is active; this is the fallback for reduced-motion, touch and
     no-JS. scroll-padding-top keeps the sticky nav off the section heading -
     the script reads the same value. */
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }

  /* ── Fluid layout ─────────────────────────────────────────────────────────
     This used to be two breakpoints (768 and 480) doing all the work, which
     meant a 320px phone and a 760px tablet were handed byte-identical padding,
     and the 360-430px band where most phones actually live got one frozen
     layout. Every dimension that should *scale* is now a single clamp() that
     interpolates continuously from a 280px foldable to the 1040px container -
     so there is no width at which the page is caught between two layouts.

     Media queries are kept only for the handful of genuinely binary decisions
     (is there a hamburger? is there room for the secondary CTA?), where there
     is nothing to interpolate.

     Still !important: the components below style themselves inline, and an
     inline declaration outranks any normal rule in a stylesheet. */
  :root {
    --gutter:     clamp(14px, 4vw, 28px);   /* container side padding      */
    --section-y:  clamp(34px, 8.5vw, 96px); /* vertical rhythm per section */
    --hero-photo: clamp(104px, 26vw, 200px);
    --hero-gap:   clamp(20px, 5vw, 48px);
    --cta-icon:   clamp(36px, 10.5vw, 44px);
    /* Corner offset shared by the chat launcher and its cue, so the pair stays
       glued together and both clear the iOS home indicator. */
    --fab-right:  calc(16px + env(safe-area-inset-right, 0px));
    --fab-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .container { padding-left: var(--gutter) !important; padding-right: var(--gutter) !important; }
  section:not(#hero) { padding-top: var(--section-y) !important; padding-bottom: var(--section-y) !important; }
  /* The hero is sized by min-height, not padding: it only needs enough bottom
     room to keep the scroll cue off the fold. */
  #hero { padding-top: clamp(20px, 5vw, 40px) !important; padding-bottom: clamp(28px, 7vw, 40px) !important; }
  /* `.container` is a grandchild of #hero (there is a flex wrapper between
     them), so the `>` here has never matched and the hero row has been stuck
     at its inline gap: 48 on every phone. Descendant combinator. */
  #hero .container > div { gap: var(--hero-gap) !important; }
  /* Last section on the page - it doesn't need a full rhythm unit under it.
     Qualified with `section` on purpose: `:not(#hero)` above carries its
     argument's specificity, so a bare `#contact` (1,0,0) loses to
     `section:not(#hero)` (1,0,1) and this would silently do nothing. */
  section#contact { padding-bottom: clamp(24px, 5vw, 40px) !important; }
  img[alt="Justin Hatch"] { width: var(--hero-photo) !important; height: var(--hero-photo) !important; }
  .hero-ctas a[aria-label] {
    width: var(--cta-icon) !important; height: var(--cta-icon) !important; flex-shrink: 0 !important;
  }

  /* Hamburger is hidden on desktop */
  .nav-hamburger { display: none; }
  @media (max-width: 768px) {
    /* nav: hide section-anchor row, keep name + social icons */
    .nav-sections { display: none !important; }
    /* push social icons right when section anchors are hidden */
    .nav-icons { margin-left: auto !important; }
    .nav-hamburger { display: inline-flex !important; }
    .hero-ctas { gap: 8px !important; }
  }
  /* Below ~360px the name plus four nav targets stop fitting on one 60px row,
     so the social icons step aside - they are repeated in the hero and again
     in Contact, and the hamburger is the affordance that isn't. */
  @media (max-width: 359px) {
    .nav-icons { display: none !important; }
    /* The auto margin that pushes the right-hand group over lives on
       .nav-icons; hiding it takes the margin with it and leaves the
       hamburger stranded beside the name. Hand it to the hamburger. */
    .nav-hamburger { margin-left: auto !important; }
  }

  /* Nothing should be able to push the page wider than the viewport. Note what
     is NOT here: an `overflow-x: clip/hidden` on html or body. Both were tried;
     either one stops the nav from sticking (measured: header top went to
     -1500px at scrollY 1500), because a clipped root is no longer the sticky
     element's scrollport. Horizontal overflow is fixed at the cause instead -
     fluid gutters, a hero column that can shrink, a CTA row that wraps - and
     the responsive audit asserts scrollWidth === innerWidth at every size. */
  img, object, iframe, video, canvas, table, pre { max-width: 100%; }
  /* A long unbroken token (a URL in a bubble, a repo name) must wrap rather
     than widen its container. */
  body { overflow-wrap: break-word; }

  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink-2);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(29,78,216,0.18); color: var(--ink); }
  a { color: var(--accent); text-decoration: none; transition: opacity 0.15s; }
  a:hover { opacity: 0.7; }
  /* Tailwind's preflight used to normalise these for free. It is gone now, and
     form controls do not inherit the page font on their own: a bare <input>
     drops to the UA's own 13.33px system default. Everything else preflight
     did for this page (box-sizing, body margin, link colours, image max-width)
     was already declared above, so this is the only piece that had to come
     back. */
  button, input, optgroup, select, textarea {
    font-family: inherit; font-size: 100%; line-height: inherit; margin: 0;
  }
  button { cursor: pointer; }

  h1 { font-weight: 700 !important; }
  h2 { font-weight: 700 !important; }
  h3 { font-weight: 650 !important; }
  h1, h2, h3 { color: var(--ink); letter-spacing: -0.02em; margin: 0; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Slide-In Button (CSS re-creation of the Framer Slide-In Button design). */
  .slide-in-btn {
    /* Rendered as a <button> - it opens the chat composer rather than
       navigating - so the UA button styles have to be reset here. */
    border: 0;
    font-family: inherit;
    cursor: pointer;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    overflow: hidden;
    isolation: isolate;
    cursor: pointer;
    transition: color 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    text-decoration: none;
  }
  .slide-in-btn__fill {
    position: absolute;
    inset: 0;
    background: #fff;
    transform: translateX(-101%);
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: -1;
  }
  .slide-in-btn__text, .slide-in-btn__arrow {
    position: relative;
    z-index: 1;
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .slide-in-btn:hover { color: var(--accent); opacity: 1; }
  .slide-in-btn:hover .slide-in-btn__fill  { transform: translateX(0); }
  .slide-in-btn:hover .slide-in-btn__arrow { transform: translateX(3px); }
  .slide-in-btn:focus-visible {
    outline: 2px solid rgba(29,78,216,0.5);
    outline-offset: 2px;
  }

  /* ── Disco ball ───────────────────────────────────────────────────────────
     A hung object, so it swings from its top edge rather than spinning about
     its middle. Hover throws a blurred conic gradient behind it and turns the
     swing up. The glow lives outside the button's edge on purpose: a disco
     ball that lit only the inside of its own circle would be a lamp.
     Colour stays behind the hover, which is what lets this sit in a row of
     navy line icons without fighting them. */
  @keyframes discoSway { 0%, 100% { transform: rotate(-8deg) }
                         50%      { transform: rotate(8deg) } }
  @keyframes discoGlow { to { transform: rotate(360deg) } }

  .disco {
    font-size: 21px; line-height: 1; display: block;
    position: relative; z-index: 1;
    transform-origin: 50% 0;
    animation: discoSway 3.4s ease-in-out infinite;
  }
  .hero-secondary-cta { position: relative; }
  .hero-secondary-cta::before {
    content: ''; position: absolute; inset: -4px; border-radius: 50%; z-index: 0;
    background: conic-gradient(from 0deg, #f72585, #ffd166, #4cc9f0, #b5179e, #f72585);
    filter: blur(7px); opacity: 0;
    transition: opacity 0.25s ease;
  }
  .hero-secondary-cta:hover::before,
  .hero-secondary-cta:focus-visible::before {
    opacity: 0.8; animation: discoGlow 2.4s linear infinite;
  }
  .hero-secondary-cta:hover .disco,
  .hero-secondary-cta:focus-visible .disco { animation-duration: 1.1s; }

  /* Every section fades up on entry, the hero headline flips letter-by-letter,
     and the scroll cue bounces. For a visitor with a vestibular disorder that's
     a page full of motion they can't opt out of - honour the OS-level setting.
     Animations are reduced to a single frame rather than removed, so anything
     that relies on an animationend/transitionend callback still fires. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    html { scroll-behavior: auto !important; }
  }

  /* Keyboard users need to see where focus is. The site is heavily custom-styled,
     so several interactive elements otherwise render no visible focus ring. */
  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
