<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --ink: #0a2540;
    --ink-2: #2a4365;
    --ink-3: #5a7090;
    --accent: #1d4ed8;
    --accent-soft: #2563eb;
    --border: rgba(10,37,64,0.10);
    --border-strong: rgba(10,37,64,0.20);
    --shadow: 0 1px 2px rgba(10,37,64,0.04), 0 8px 24px rgba(10,37,64,0.06);
  }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; }

  /* Mobile responsive overrides (≤768px). Inline-style padding wins over
     normal CSS, so we use !important here to tighten things on phones. */
  @media (max-width: 768px) {
    section { padding-top: 40px !important; padding-bottom: 40px !important; }
    #hero  { padding-top: 60px !important; padding-bottom: 90px !important; }
    /* nav: hide section-anchor row, keep name + social icons */
    .nav-sections { display: none !important; }
    /* container side padding */
    .container { padding-left: 16px !important; padding-right: 16px !important; }
    /* push social icons right when section anchors are hidden */
    .nav-icons { margin-left: auto !important; }
    /* show hamburger on mobile */
    .nav-hamburger { display: inline-flex !important; }
    /* hero CTAs all stay on one line on mobile - tighten gap + button padding */
    .hero-ctas { gap: 8px !important; flex-wrap: nowrap !important; }
    .hero-ctas > a:first-child { padding-left: 18px !important; padding-right: 18px !important; }
    .hero-ctas a[aria-label="Email"], .hero-ctas a[aria-label="Resume"], .hero-ctas a[aria-label="LinkedIn"] {
      width: 40px !important; height: 40px !important; flex-shrink: 0 !important;
    }
    /* "Interactive mode" is a secondary CTA - hide on mobile to make room for
       the primary "Hire me" button + icon links. */
    .hero-secondary-cta { display: none !important; }
    /* hero photo smaller */
    img[alt="Justin Hatch"] { width: 110px !important; height: 110px !important; }
    /* Inter hero gap tightening */
    #hero > .container > div { gap: 24px !important; }
  }
  /* Hamburger is hidden on desktop */
  .nav-hamburger { display: none; }
  @media (max-width: 480px) {
    section { padding-top: 32px !important; padding-bottom: 32px !important; }
    .container { padding-left: 14px !important; padding-right: 14px !important; }
  }
  /* Nothing should be able to push the page wider than the viewport. */
  img, object, iframe, video, canvas, table { max-width: 100%; }

  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink-2);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }
  * { box-sizing: border-box; }
  ::selection { background: rgba(29,78,216,0.18); color: var(--ink); }
  a { color: var(--accent); text-decoration: none; transition: opacity 0.15s; }
  a:hover { opacity: 0.7; }
  button { font-family: inherit; cursor: pointer; }

  h1 { font-weight: 700 !important; }
  h2 { font-weight: 700 !important; }
  h3 { font-weight: 650 !important; }
  h1, h2, h3 { color: var(--ink); letter-spacing: -0.02em; margin: 0; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Slide-In Button (CSS re-creation of the Framer Slide-In Button design). */
  .slide-in-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    overflow: hidden;
    isolation: isolate;
    cursor: pointer;
    transition: color 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    text-decoration: none;
  }
  .slide-in-btn__fill {
    position: absolute;
    inset: 0;
    background: #fff;
    transform: translateX(-101%);
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    z-index: -1;
  }
  .slide-in-btn__text, .slide-in-btn__arrow {
    position: relative;
    z-index: 1;
    transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
  }
  .slide-in-btn:hover { color: var(--accent); opacity: 1; }
  .slide-in-btn:hover .slide-in-btn__fill  { transform: translateX(0); }
  .slide-in-btn:hover .slide-in-btn__arrow { transform: translateX(3px); }
  .slide-in-btn:focus-visible {
    outline: 2px solid rgba(29,78,216,0.5);
    outline-offset: 2px;
  }

  /* Every section fades up on entry, the hero headline flips letter-by-letter,
     and the scroll cue bounces. For a visitor with a vestibular disorder that's
     a page full of motion they can't opt out of - honour the OS-level setting.
     Animations are reduced to a single frame rather than removed, so anything
     that relies on an animationend/transitionend callback still fires. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    html { scroll-behavior: auto !important; }
  }

  /* Keyboard users need to see where focus is. The site is heavily custom-styled,
     so several interactive elements otherwise render no visible focus ring. */
  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- The whole page is client-rendered. Without this a visitor with JS disabled
       (or a crawler that doesn't execute JS) sees a blank white page and no way
       to reach the resume or the contact address. -->
  <noscript>
    <div style="max-width:640px;margin:12vh auto;padding:0 24px;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;color:#0a2540">
      <h1 style="font-size:32px;margin:0 0 8px">Justin Hatch</h1>
      <p style="color:#2a4365;margin:0 0 20px">Software Engineer, AI/ML at Horizon Intelligence Labs &middot; Cambridge, Massachusetts</p>
      <p style="color:#5a7090">This portfolio renders with JavaScript. With it disabled, you can still reach:</p>
      <ul style="color:#1d4ed8">
        <li><a href="/Resume.pdf" style="color:#1d4ed8">Resume (PDF)</a></li>
        <li><a href="mailto:jjhatch03@gmail.com" style="color:#1d4ed8">jjhatch03@gmail.com</a></li>
        <li><a href="https://github.com/jhatch3" style="color:#1d4ed8">github.com/jhatch3</a></li>
        <li><a href="https://www.linkedin.com/in/justinhatch/" style="color:#1d4ed8">linkedin.com/in/justinhatch</a></li>
      </ul>
    </div>
  </noscript>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <!-- Modular data: profile must load first (creates window.JH_DATA), rest extend it. -->
  <script src="data/profile.js"></script>
  <script src="data/projects.js"></script>
  <script src="data/education.js"></script>
  <script src="data/writing.js"></script>
  <script src="data/now.js"></script>

  <script type="text/babel">
    const D = window.JH_DATA;

    // ─── cn() ─────────────────────────────────────────────────────────────────
    // Tiny shadcn-style class joiner (no tailwind-merge - keep it light).
    const cn = (...args) => args.flat().filter(Boolean).join(' ');

    // ─── useOutsideClick ─────────────────────────────────────────────────────
    const useOutsideClick = (ref, callback) => {
      React.useEffect(() => {
        const listener = (e) => {
          if (!ref.current || ref.current.contains(e.target)) return;
          callback(e);
        };
        document.addEventListener('mousedown', listener);
        document.addEventListener('touchstart', listener);
        return () => {
          document.removeEventListener('mousedown', listener);
          document.removeEventListener('touchstart', listener);
        };
      }, [ref, callback]);
    };

    // ─── Projects list ───────────────────────────────────────────────────────
    // A compact index: one line per project, title plus sector. The subtitle is
    // hidden until you hover the row (or focus it), so the default state is
    // eleven titles rather than eleven paragraphs. Screenshots live only in the
    // detail panel.
    //
    // Hover, focus and the reveal are plain CSS rather than React state: it
    // keeps the row from re-rendering on every pointer move, and it lets the
    // (hover: none) query below pin the subtitles open on touch, where there is
    // no hover to reveal them with.
    const projectRows = D.projects.map(p => ({
      id: p.id,
      title: p.name,
      description: p.subtitle,
      url: p.url || null,
      writeup: p.writeup || null,
      bullets: p.bullets || [],
      tags: p.tags,
      sector: p.sector,
      image: p.image,
    }));

    const ProjectsList = () => {
      const [active, setActive] = React.useState(null);
      const ref = React.useRef(null);

      React.useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') setActive(null); };
        document.body.style.overflow = active ? 'hidden' : 'auto';
        window.addEventListener('keydown', onKey);
        return () => {
          document.body.style.overflow = 'auto';
          window.removeEventListener('keydown', onKey);
        };
      }, [active]);

      useOutsideClick(ref, () => setActive(null));

      return (
        <>
          {/* Detail panel */}
          {active && (
            <>
              {/* Backdrop sits above the sticky nav (z:50) so the hamburger is
                  both visually covered AND non-clickable while a project is
                  open. */}
              <div className="fixed inset-0 bg-black/30 z-[60] animate-[fadeIn_0.18s_ease-out]" />
              <div className="fixed inset-0 grid place-items-center z-[100] p-4">
                <div ref={ref} style={{
                  width: '100%', maxWidth: 560, maxHeight: '90vh',
                  display: 'flex', flexDirection: 'column',
                  background: 'var(--surface)', borderRadius: 14, overflow: 'hidden',
                  border: '1px solid var(--border)', boxShadow: 'var(--shadow)',
                  animation: 'scaleIn 0.18s ease-out',
                }}>
                  {active.image && (
                    <img src={active.image} alt={active.title} loading="lazy" decoding="async"
                      width="1200" height="800"
                      style={{
                        display: 'block', width: '100%', height: 240,
                        objectFit: 'cover', objectPosition: 'top',
                        borderBottom: '0.5px solid var(--border)', background: '#f0f3f8',
                      }} />
                  )}
                  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 16, padding: '22px 24px 0' }}>
                    <div style={{ minWidth: 0 }}>
                      <SectorBadge sector={active.sector} />
                      <h3 style={{ fontSize: 19, marginTop: 8 }}>{active.title}</h3>
                      <p style={{ fontSize: 13.5, color: 'var(--ink-3)', margin: '6px 0 0', lineHeight: 1.5 }}>
                        {active.description}
                      </p>
                    </div>
                    {/* Bare icon, not a floating pill over the image. */}
                    <button onClick={() => setActive(null)} aria-label="Close"
                      style={{ background: 'transparent', border: 0, padding: 4, margin: -4, lineHeight: 0, color: 'var(--ink-3)', flexShrink: 0, transition: 'color 0.15s' }}
                      onMouseEnter={(e) => { e.currentTarget.style.color = 'var(--ink)'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.color = 'var(--ink-3)'; }}>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg>
                    </button>
                  </div>
                  <div style={{ padding: '20px 24px 24px', overflowY: 'auto' }}>
                    {active.bullets.length > 0 && (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 9, marginBottom: 20 }}>
                        {active.bullets.map((b, i) => (
                          <div key={i} style={{ display: 'flex', gap: 10, fontSize: 13.5, lineHeight: 1.6, color: 'var(--ink-2)' }}>
                            <span style={{ color: 'var(--border-strong)', flexShrink: 0, userSelect: 'none' }}>-</span>
                            <span>{b}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {/* Text links, no pills. Absent entirely when there's no
                        public repo - the old fallback pointed at #projects. */}
                    {(active.url || active.writeup) && (
                      <div style={{ display: 'flex', gap: 20, flexWrap: 'wrap', marginBottom: 18, fontSize: 14, fontWeight: 600 }}>
                        {active.url && (
                          <a href={active.url} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--accent)' }}>GitHub ↗</a>
                        )}
                        {active.writeup && (
                          <a href={active.writeup} target="_blank" rel="noopener noreferrer" style={{ color: 'var(--accent)' }}>Write-up ↗</a>
                        )}
                      </div>
                    )}
                    <div style={{
                      fontSize: 11, fontFamily: "'JetBrains Mono', monospace",
                      color: 'var(--ink-3)', letterSpacing: '0.04em', lineHeight: 1.7,
                    }}>
                      {active.tags.join(' · ')}
                    </div>
                  </div>
                </div>
              </div>
            </>
          )}

          {/* The index */}
          <div>
            {projectRows.map(p => (
              <div key={p.id} className="proj-row" onClick={() => setActive(p)}>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, minWidth: 0 }}>
                    <span className="proj-title">{p.title}</span>
                    <SectorBadge sector={p.sector} />
                  </div>
                  <div className="proj-sub">
                    <div style={{ fontSize: 13, color: 'var(--ink-3)', lineHeight: 1.45, paddingTop: 5 }}>
                      {p.description}
                    </div>
                  </div>
                </div>
                {/* Bare text, no pill. Kept as a <button> so keyboard users
                    still have a focusable way in - and focusing it reveals the
                    subtitle via :focus-within, the same as hovering. */}
                <button className="proj-open">Open</button>
              </div>
            ))}
          </div>

          <style>{`
            @keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
            @keyframes scaleIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

            .proj-row {
              display: flex; align-items: center; justify-content: space-between;
              gap: 20px; padding: 13px 0; cursor: pointer;
            }
            .proj-row + .proj-row { border-top: 0.5px solid var(--border); }
            .proj-title {
              font-size: 16.5px; font-weight: 600; letter-spacing: -0.015em;
              color: var(--ink);
              transition: color 0.15s; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap;
            }
            .proj-open {
              background: transparent; border: 0; padding: 0; flex-shrink: 0;
              font-family: inherit; font-size: 12px; font-weight: 600;
              letter-spacing: 0.04em; color: var(--ink-3); transition: color 0.15s;
            }
            .proj-row:hover .proj-title, .proj-row:focus-within .proj-title,
            .proj-row:hover .proj-open,  .proj-row:focus-within .proj-open {
              color: var(--accent);
            }
            /* Collapsed by default, revealed on hover/focus. max-height rather
               than display:none so it can animate; 72px clears three wrapped
               lines at the narrowest desktop width. */
            .proj-sub {
              overflow: hidden; max-height: 0; opacity: 0;
              transition: max-height 0.22s ease, opacity 0.18s ease;
            }
            .proj-row:hover .proj-sub, .proj-row:focus-within .proj-sub {
              max-height: 72px; opacity: 1;
            }
            /* No hover to reveal them with, so leave them open. */
            @media (hover: none), (pointer: coarse) {
              .proj-sub { max-height: none; opacity: 1; }
              .proj-title { white-space: normal; }
            }
          `}</style>
        </>
      );
    };

    // ─── FlipWords (CSS-keyframe port of Aceternity's flip-words) ───────────
    // Cycles through words; each word fades+blur-clears letter-by-letter on entry.
    const FlipWords = ({ words, duration = 3000, className }) => {
      const [idx, setIdx] = React.useState(0);
      React.useEffect(() => {
        const t = setTimeout(() => setIdx(i => (i + 1) % words.length), duration);
        return () => clearTimeout(t);
      }, [idx, duration, words.length]);

      const word = words[idx];
      const letters = word.split('');

      return (
        <span className={cn('z-10 inline-block relative text-left px-1', className)} style={{ verticalAlign: 'baseline' }}>
          <span className="inline-block whitespace-nowrap" key={idx}>
            {letters.map((letter, i) => (
              <span key={`${idx}-${i}`} className="inline-block"
                onAnimationEnd={(e) => {
                  e.currentTarget.style.filter = 'none';
                  e.currentTarget.style.willChange = 'auto';
                }}
                style={{
                  animation: `flipLetter 0.45s ease-out ${i * 0.045}s both`,
                  whiteSpace: letter === ' ' ? 'pre' : 'normal',
                  willChange: 'filter, transform, opacity',
                  WebkitFontSmoothing: 'antialiased',
                  MozOsxFontSmoothing: 'grayscale',
                }}>
                {letter === ' ' ? ' ' : letter}
              </span>
            ))}
          </span>
          <style>{`
            @keyframes flipLetter {
              from { opacity: 0; transform: translateY(10px); filter: blur(8px); }
              to   { opacity: 1; transform: translateY(0);   filter: blur(0);   }
            }
            /* Mobile: skip the filter:blur path entirely. iOS and Android both
               leave residual sub-pixel blur on letters that animate through
               filter:blur() because the compositor layer doesn't release cleanly.
               Pure opacity + translate keeps text crisp. */
            @media (max-width: 768px), (hover: none), (pointer: coarse) {
              @keyframes flipLetter {
                from { opacity: 0; transform: translateY(10px); }
                to   { opacity: 1; transform: translateY(0);   }
              }
            }
          `}</style>
        </span>
      );
    };
    // ─── /FlipWords ──────────────────────────────────────────────────────────

    // ─── Reusable ─────────────────────────────────────────────────────────────
    const Container = ({ children, style }) => (
      <div className="container" style={{ maxWidth: 1040, margin: '0 auto', padding: '0 28px', ...style }}>{children}</div>
    );

    const Eyebrow = ({ children }) => (
      <div style={{
        fontSize: 11, fontWeight: 700, letterSpacing: '0.18em', textTransform: 'uppercase',
        color: 'var(--accent)', marginBottom: 14,
      }}>{children}</div>
    );

    // Sector, as mono uppercase text. No colored dot: five hues competing with
    // the single blue accent was the loudest thing left on the page.
    const SectorBadge = ({ sector }) => {
      if (!sector) return null;
      return (
        <span style={{
          fontSize: 10, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase',
          color: 'var(--ink-3)', fontFamily: "'JetBrains Mono', monospace", whiteSpace: 'nowrap',
        }}>{sector}</span>
      );
    };

    // ─── Sticky top nav (with mobile drawer) ─────────────────────────────────
    const Nav = () => {
      const [scrolled, setScrolled] = React.useState(false);
      const [open, setOpen] = React.useState(false);
      React.useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 8);
        onScroll();
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      // Close drawer on resize past mobile breakpoint
      React.useEffect(() => {
        const onResize = () => { if (window.innerWidth > 768) setOpen(false); };
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);
      const close = () => setOpen(false);

      const sectionLinks = [
        { href: '#resume',     label: 'Resume' },
        { href: '#projects',   label: 'Projects' },
        { href: '#writing',    label: 'Writing' },
        { href: '#education',  label: 'Education' },
      ];

      return (
        <header style={{

                }}>
                  <div style={{
                    fontSize: 11, fontWeight: 800, color: 'var(--ink)', letterSpacing: '0.1em',
                    textTransform: 'uppercase', flex: '0 0 auto', minWidth: 150,
                  }}>{row.label}</div>
                  <div style={{ fontSize: 13.5, lineHeight: 1.6, color: 'var(--ink-2)', flex: '1 1 320px' }}>
                    {row.items.join('  ·  ')}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </Container>
      </section>
    );

    // ─── Projects (expandable card grid - the prior 'old way' format) ──────
    const ProjectsCardSection = () => (
      <section id="projects" style={{ padding: '96px 0', animation: 'fadeUp 0.75s ease-out' }}>
        <Container>
          <SectionHeader eyebrow="Selected Work" title="Projects" />
          <ProjectsList />
        </Container>
      </section>
    );

    // ─── GitHub contribution graph (live) ──────────────────────────────────────
    // Just the 53-week × 7-day square grid of the last year's public
    // contributions, sitting under the hero text. The whole grid links to the
    // GitHub profile. Data comes from the open, CORS-enabled jogruber proxy of
    // GitHub's contributions calendar (no token needed) and is cached in
    // localStorage for 6h so repeat visits paint instantly.
    const CONTRIB_LEVELS = [
      'rgba(10,37,64,0.10)',   // 0 - no contributions
      'rgba(23,62,170,0.45)',  // 1
      'rgba(23,62,170,0.66)',  // 2
      'rgba(23,62,170,0.85)',  // 3
      'rgba(20,52,140,1)',     // 4 - busiest days, deep navy-blue
    ];
    const ContributionGraph = () => {
      const GAP = 3;
      const handle = ((D.links.github && D.links.github.label) || 'github.com/jhatch3')
        .replace(/^github\.com\//, '').replace(/\/$/, '');
      const githubHref = (D.links.github && D.links.github.href) || ('https://github.com/' + handle);
      const [data, setData] = React.useState(null);   // { total, days: [{date,count,level}] }
      const [failed, setFailed] = React.useState(false);

      React.useEffect(() => {
        let alive = true;
        const cacheKey = 'gh-contrib:' + handle;
        const TTL = 6 * 60 * 60 * 1000;
        // Paint instantly from cache if it's fresh…
        try {
          const raw = localStorage.getItem(cacheKey);
          if (raw) {
            const c = JSON.parse(raw);
            if (c && Date.now() - c.t < TTL && c.d) setData(c.d);
          }
        } catch (e) { /* private mode / quota - ignore */ }
        // …then always refresh in the background.
        fetch('https://github-contributions-api.jogruber.de/v4/' + encodeURIComponent(handle) + '?y=last')
          .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(json => {
            if (!alive) return;
            const payload = { total: (json.total && json.total.lastYear) || 0, days: json.contributions || [] };
            setData(payload);
            try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), d: payload })); } catch (e) {}
          })
          .catch(() => { if (alive) setFailed(true); });
        return () => { alive = false; };
      }, [handle]);

      // Bucket the flat day list into week-columns (rows = Sun→Sat), padding the
      // first column so the calendar starts on the right weekday.
      const weeks = React.useMemo(() => {
        if (!data || !data.days.length) return [];
        const out = [];
        let col = [];
        const firstDow = new Date(data.days[0].date + 'T00:00:00').getDay();
        for (let i = 0; i < firstDow; i++) col.push(null);
        data.days.forEach(d => {
          col.push(d);
          if (col.length === 7) { out.push(col); col = []; }
        });
        if (col.length) { while (col.length < 7) col.push(null); out.push(col); }
        return out;
      }, [data]);

      const skeleton = !data && !failed;
      const cols = skeleton ? Array.from({ length: 53 }) : weeks;

      // Fetch failed and nothing cached: render nothing rather than an empty frame.
      if (failed && !data) return null;

      // Just the squares. The whole grid is a subtle link to the GitHub profile.
      return (
        <a href={githubHref} target="_blank" rel="noopener noreferrer"
           className="contrib-grid"
           aria-label={data ? (data.total.toLocaleString() + ' GitHub contributions in the last year') : 'GitHub contributions'}
           title="GitHub contributions · last 12 months"
           style={{
             display: 'block', marginTop: 28, width: '100%',
             opacity: skeleton ? 0.5 : 1, transition: 'opacity 0.3s',
             animation: 'fadeUp 0.6s ease-out',
           }}>
          <div style={{ display: 'flex', gap: GAP, width: '100%' }}>
            {cols.map((col, ci) => (
              <div key={ci} style={{ display: 'flex', flexDirection: 'column', gap: GAP, flex: '1 1 0', minWidth: 0 }}>
                {(skeleton ? Array.from({ length: 7 }) : col).map((d, ri) => (
                  <div key={ri}
                    title={(!skeleton && d) ? (d.count + ' contribution' + (d.count === 1 ? '' : 's') + ' on ' + d.date) : undefined}
                    style={{
                      width: '100%', aspectRatio: '1', borderRadius: 2,
                      background: skeleton ? CONTRIB_LEVELS[0] : (d ? CONTRIB_LEVELS[d.level] : 'transparent'),
                      outline: (!skeleton && d) ? '0.5px solid rgba(10,37,64,0.04)' : 'none',
                      outlineOffset: -0.5,
                    }} />
                ))}
              </div>
            ))}
          </div>
        </a>
      );
    };

    // ─── App ──────────────────────────────────────────────────────────────────
    const App = () => (
      <>
        <Nav />
        <Hero />
        <ResumeEmbed />
        <ProjectsCardSection />
        <Writing />
        <EducationSection />
        <Contact />
      </>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
